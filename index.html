<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار العلوم الفيزيائية - مؤشرات الاختبارات الوطنية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:1050px;margin:auto;padding:22px}
header{background:linear-gradient(135deg,#173b70,#2878b9);color:white;border-radius:18px;padding:28px;margin-bottom:18px;box-shadow:0 8px 25px #0002}
h1{margin:0 0 8px;font-size:28px}.sub{opacity:.9}
.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0000000d}
input{width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer;background:#1769aa;color:white}
button.secondary{background:#e8eef6;color:#173b70}.start{margin-top:12px}
.hidden{display:none}.topic-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{background:#eaf3ff;color:#1769aa;padding:6px 10px;border-radius:20px;font-size:13px}
.progress-wrap{height:13px;background:#e6ebf2;border-radius:20px;overflow:hidden}.progress{height:100%;background:#2b8a5a;width:0%;transition:.3s}
.q{border:1px solid #e0e6ef;border-radius:14px;padding:17px;margin:14px 0}.q h3{font-size:17px;margin-top:0}
.option{display:block;padding:11px;margin:8px 0;background:#f7f9fc;border-radius:9px;cursor:pointer;border:1px solid transparent}
.option:hover{border-color:#8ebbe0}.option input{width:auto;margin-left:8px}
.feedback{padding:10px;border-radius:9px;margin-top:10px;font-size:14px}.correct{background:#e7f7ed;color:#17633b}.wrong{background:#fff0f0;color:#9a2525}
.topic-progress{font-size:13px;color:#657083;margin-top:7px}
#result{text-align:center}.score{font-size:46px;font-weight:bold;color:#1769aa}
.stat{display:inline-block;margin:7px;padding:13px 18px;background:#f2f6fb;border-radius:12px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #e2e7ee;text-align:right}
@media(max-width:650px){.container{padding:10px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>اختبار العلوم الفيزيائية</h1>
<div class="sub">اختبار تفاعلي مبني على مؤشرات نواتج التعلم في الوثيقة المرفقة</div>
</header>

<div id="start" class="card">
<h2>بيانات الطالب</h2>
<p>اكتب اسمك ثم ابدأ الاختبار. سيتم حساب الدرجة والتقدم والتغذية الراجعة تلقائيًا.</p>
<input id="studentName" placeholder="اسم الطالب">
<button class="start" onclick="startQuiz()">ابدأ الاختبار</button>
</div>

<div id="quiz" class="hidden">
<div class="card">
<div class="topic-title"><strong id="studentLabel"></strong><span id="counter"></span></div>
<div class="progress-wrap"><div class="progress" id="bar"></div></div>
</div>
<div id="questions"></div>
<div class="card">
<button onclick="submitQuiz()">إنهاء الاختبار وعرض النتيجة</button>
</div>
</div>

<div id="result" class="hidden card">
<h2>نتيجة الاختبار</h2>
<div class="score" id="score"></div>
<div id="summary"></div>
<div id="topicResults"></div>
<button onclick="location.reload()">إعادة الاختبار</button>
</div>
</div>

let all=[], answers=[], student="";
function startQuiz(){
 student=document.getElementById("studentName").value.trim()||"طالب";
 document.getElementById("start").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 document.getElementById("studentLabel").textContent="الطالب: "+student;
 all=[]; topics.forEach((t,ti)=>t.qs.forEach((q,qi)=>all.push({...q,ti,qi})));
 render(); updateProgress();
}
function render(){
 const box=document.getElementById("questions"); box.innerHTML="";
 topics.forEach((t,ti)=>{
  let sec=document.createElement("div"); sec.className="card";
  sec.innerHTML=`<div class="topic-title"><h2>${t.title}</h2><span class="badge">${t.qs.length} أسئلة</span></div><div class="topic-progress">المؤشر: ${t.indicator}</div>`;
  t.qs.forEach((q,qi)=>{
   let idx=all.findIndex(x=>x.ti===ti&&x.qi===qi);
   let div=document.createElement("div"); div.className="q";
   div.innerHTML=`<h3>${idx+1}. ${q[0]}</h3>`+
    q[1].map((o,i)=>`<label class="option"><input type="radio" name="q${idx}" value="${i}" onchange="choose(${idx},${i})"> ${o}</label>`).join("")+
    `<div id="fb${idx}" class="feedback hidden"></div>`;
   sec.appendChild(div);
  }); box.appendChild(sec);
 });
 document.getElementById("counter").textContent=`${all.length} سؤال`;
}
function choose(i,v){answers[i]=v;updateProgress();let fb=document.getElementById("fb"+i);fb.classList.add("hidden")}
function updateProgress(){
 let done=answers.filter(x=>x!==undefined).length;
 document.getElementById("bar").style.width=(done/all.length*100)+"%";
}
function submitQuiz(){
 let unanswered=all.length-answers.filter(x=>x!==undefined).length;
 if(unanswered && !confirm(`لم تُجب عن ${unanswered} سؤالًا. هل تريد إنهاء الاختبار؟`))return;
 let score=0, topicScores=topics.map(()=>({right:0,total:0}));
 all.forEach((q,i)=>{
  topicScores[q.ti].total++;
  let fb=document.getElementById("fb"+i);fb.classList.remove("hidden");
  if(answers[i]===q[2]){score++;topicScores[q.ti].right++;fb.className="feedback correct";fb.textContent="✓ إجابة صحيحة — "+q[3]}
  else{fb.className="feedback wrong";fb.textContent="✗ إجابة غير صحيحة — الإجابة الصحيحة: "+q[1][q[2]]+" — "+q[3]}
 });
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 let pct=Math.round(score/all.length*100);
 document.getElementById("score").textContent=`${score} / ${all.length} (${pct}%)`;
 document.getElementById("summary").innerHTML=`<div class="stat">الطالب: ${student}</div><div class="stat">الصحيحة: ${score}</div><div class="stat">غير الصحيحة: ${all.length-score}</div>`;
 let rows=topicScores.map((s,i)=>`<tr><td>${topics[i].title}</td><td>${topics[i].indicator}</td><td>${s.right}/${s.total}</td><td>${Math.round(s.right/s.total*100)}%</td></tr>`).join("");
 document.getElementById("topicResults").innerHTML=`<h3>تحليل الأداء حسب الموضوع والمؤشر</h3><table><tr><th>الموضوع</th><th>المؤشر</th><th>الدرجة</th><th>النسبة</th></tr>${rows}</table>`;
 window.scrollTo(0,0);
}
</script>
